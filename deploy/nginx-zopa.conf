# ZOPA — nginx site config for a single Linode server.
# Put this at: /etc/nginx/sites-available/zopa
# Then enable it (see DEPLOY_LINODE.md).
#
# It does two jobs:
#   1. Serves the Angular app (static files) at the website root.
#   2. Sends /api/... requests to Laravel (PHP).

server {
    listen 80;
    listen [::]:80;

    # 👉 CHANGE THIS to your domain (or the Linode IP while testing)
    server_name p2p.zopapro.com;

    # ---- 1) Laravel API + storage live under /var/www/zopa/zopa-backend/public ----
    # Anything starting with /api or /storage is handled by Laravel.
    root /var/www/zopa-frontend;     # default root = the Angular site
    index index.html;

    client_max_body_size 20M;        # allow file/document uploads

    # API → Laravel
    location ^~ /api/ {
        root /var/www/zopa/zopa-backend/public;
        try_files $uri /index.php?$query_string;
    }

    # Laravel's public storage (uploaded files, PDFs, logos)
    location ^~ /storage/ {
        root /var/www/zopa/zopa-backend/public;
        try_files $uri =404;
    }

    # Run PHP through php-fpm
    location ~ \.php$ {
        root /var/www/zopa/zopa-backend/public;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ---- 2) Everything else → the Angular single-page app ----
    # If the file isn't found, fall back to index.html so Angular routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache the hashed JS/CSS aggressively (filenames change every build)
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
